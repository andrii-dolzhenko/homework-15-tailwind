<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatchForecast — Predict. Analyze. Win.</title>
  </head>

  <body>
    <!-- App -->
    <div id="app" class="flex min-h-screen flex-col">
      <!-- Decorative players for wide screens -->
      <div id="decorative-players-root"></div>

      <!-- Header -->
      <div id="header-root"></div>

      <!-- Mobile menu -->
      <div id="mobile-menu-root"></div>

      <!-- Main content -->
      <main
        id="main-layout"
        class="relative z-10 mx-auto w-full max-w-7xl flex-1 px-4 py-5 sm:px-6 sm:py-6 lg:px-8 min-[1920px]:max-w-6xl"
      >
        <!-- Page content is controlled by JavaScript -->
        <div id="main-content-root"></div>
      </main>

      <!-- Footer -->
      <div id="footer-root"></div>

      <!-- Authentication modal -->
      <div id="auth-modal-root"></div>

      <!-- Calendar filters modal -->
      <div id="filter-modal-root"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
